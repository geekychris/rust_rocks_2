apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustrocks-service
  namespace: rustrocks
  labels:
    app.kubernetes.io/name: rustrocks-service
    app.kubernetes.io/component: database
spec:
  serviceName: rustrocks-service-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: rustrocks-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustrocks-service
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
      - name: init-permissions
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          chown -R 1000:1000 /data
          chmod 755 /data
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: rustrocks-service
        image: rustrocks-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: grpc
          containerPort: 50051
          protocol: TCP
        - name: rest
          containerPort: 8080
          protocol: TCP
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_INDEX
          value: "0"  # This will be overridden by the init script
        - name: REPLICA_COUNT
          value: "3"
        - name: RUST_LOG
          value: "info"
        - name: RUSTROCKS_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        args:
        - --config
        - /config/config.toml
        - --data-dir
        - /data
        - --enable-replication
        - --node-id
        - $(RUSTROCKS_NODE_ID)
        - --log-format
        - json
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /config
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: rustrocks-config
      # Temporary storage for writable filesystem
      - name: tmp
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app.kubernetes.io/name: rustrocks-service
        app.kubernetes.io/component: storage
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 100Gi
      # Uncomment and modify for specific storage class
      # storageClassName: fast-ssd
---
# PodDisruptionBudget to ensure availability during maintenance
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rustrocks-service-pdb
  namespace: rustrocks
  labels:
    app.kubernetes.io/name: rustrocks-service
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rustrocks-service