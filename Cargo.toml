[package]
name = "rustrocks-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# RocksDB
rocksdb = "0.21"

# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"

# gRPC
tonic = "0.11"
tonic-reflection = "0.11"
prost = "0.12"

# REST API
warp = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
clap = { version = "4.0", features = ["derive"] }
config = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
thiserror = "1.0"
anyhow = "1.0"
bytes = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
bincode = "1.3"
toml = "0.8"

# Test dependencies
[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
fastrand = "2.0"

[build-dependencies]
tonic-build = "0.11"

[[bench]]
name = "performance"
harness = false
